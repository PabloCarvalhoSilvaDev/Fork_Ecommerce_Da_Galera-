<a class="produto" [routerLink]="['/catalog/product', produto().slug]">
  <span class="produto__imagem" aria-hidden="true">
    @if (produto().oferta) {
      <span class="produto__selo">Oferta</span>
    }
    <svg
      width="28"
      height="28"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="3" y="4" width="18" height="16" rx="2"></rect>
      <circle cx="9" cy="10" r="2"></circle>
      <path d="m21 17-5-5-9 8"></path>
    </svg>
  </span>
  <span class="produto__nome">{{ produto().nome }}</span>
  @if (produto().oferta) {
    <span class="visualmente-oculto">Em oferta.</span>
  }
  <span class="produto__sku">SKU {{ produto().sku }}</span>
  <span class="produto__preco">{{ produto().preco | moeda }}</span>
  @if (produto().estoque === 0) {
    <span class="produto__esgotado">Esgotado</span>
  }
</a>
