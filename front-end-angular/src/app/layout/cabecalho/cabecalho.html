<header class="cabecalho">
  <div class="cabecalho__conteudo">
    <!-- TODO: definir o destino do clique na marca; por ora não é link. -->
    <span class="cabecalho__marca">
      <svg role="img" aria-label="Achei" width="152" height="32" viewBox="0 0 380 80">
        <rect x="0" y="8" width="64" height="64" rx="16" fill="#C2441C"></rect>
        <g fill="none" stroke="#FBF5EC" stroke-width="7" stroke-linecap="round">
          <circle cx="28" cy="36" r="13"></circle>
          <path d="M38 46 48 56"></path>
        </g>
        <circle cx="28" cy="36" r="5" fill="#F2B33D"></circle>
        <g transform="translate(92 8) scale(0.92)">
          <g
            fill="none"
            stroke="#2B1B12"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M50 24V64"></path>
            <circle cx="30" cy="44" r="20"></circle>
            <path d="M105.3 31.1A20 20 0 1 0 105.3 56.9"></path>
            <path d="M128 4V64M128 46A18 18 0 0 1 164 46V64"></path>
            <path d="M184 44H224A20 20 0 1 0 219.3 56.9"></path>
            <path d="M248 28V64"></path>
          </g>
          <circle cx="248" cy="8" r="7" fill="#C2441C"></circle>
        </g>
      </svg>
    </span>

    <form class="cabecalho__busca" role="search" (submit)="buscar($event, termo.value)">
      <svg
        aria-hidden="true"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>
      <input
        #termo
        type="search"
        name="q"
        placeholder="Buscar produtos, marcas, SKU"
        aria-label="Buscar produtos"
        enterkeyhint="search"
      />
    </form>

    <nav class="cabecalho__acoes" aria-label="Conta">
      @if (logado()) {
        <a
          routerLink="/account/orders"
          routerLinkActive="cabecalho__link--ativo"
          ariaCurrentWhenActive="page"
          class="cabecalho__link"
          aria-label="Meus pedidos"
        >
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 7l9-4 9 4-9 4-9-4z"></path>
            <path d="M3 7v10l9 4 9-4V7"></path>
            <path d="M12 11v10"></path>
          </svg>
          <span class="cabecalho__texto-opcional">Meus pedidos</span>
        </a>
      }

      <a
        routerLink="/checkout/cart"
        routerLinkActive="cabecalho__link--ativo"
        ariaCurrentWhenActive="page"
        class="cabecalho__link"
        [attr.aria-label]="rotuloCarrinho()"
      >
        <svg
          aria-hidden="true"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6"></path>
          <circle cx="9" cy="20" r="1.4"></circle>
          <circle cx="17" cy="20" r="1.4"></circle>
        </svg>
        @if (itensCarrinho() > 0) {
          <span class="cabecalho__contador" aria-hidden="true">{{ itensCarrinho() }}</span>
        }
      </a>

      @if (logado()) {
        <span class="cabecalho__usuario">
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path>
          </svg>
          <span class="cabecalho__nome">Olá, {{ primeiroNome() }}</span>
        </span>
        <button
          type="button"
          class="cabecalho__sair"
          aria-label="Sair"
          [disabled]="saindo()"
          (click)="sair()"
        >
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 4h4v16h-4"></path>
            <path d="M10 8l-4 4 4 4"></path>
            <path d="M6 12h10"></path>
          </svg>
          <span class="cabecalho__texto-opcional">Sair</span>
        </button>
      } @else {
        <a routerLink="/auth/login" class="cabecalho__entrar">
          <svg
            aria-hidden="true"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path>
          </svg>
          Entrar
        </a>
      }
    </nav>
  </div>
</header>
